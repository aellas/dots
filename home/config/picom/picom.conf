
# ─── ANIMATIONS ───
animations = true;
animation-stiffness = 420.;
animation-dampening = 40.0;
animation-clamping = true;
animation-mass = 1;
animation-for-open-window = "zoom";
animation-for-menu-window = "slide-down";
animation-for-transient-window = "slide-down";

# ─── CORNERS ───
corner-radius = 2;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'"
];

# ─── SHADOWS ───
shadow = false;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.4;

# ─── OPACITY ───
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;

opacity-rule = [
  "100:class_g = 'Chromium'",
  "100:class_g = 'Evince'",
  "90:class_g = 'Alacritty'",
  "95:class_g = 'Thunar'"
];

# ─── FADING ───
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 10;

# ─── BACKEND / PERFORMANCE ───
backend = "egl";
vsync = true;
use-damage = true;
glx-copy-from-front = false;
unredir-if-possible = true;  

# ─── DETECTION ───
detect-client-opacity = true;   
detect-rounded-corners = true;
detect-transient = true;
detect-client-leader = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-ewmh-active-win = true;

# ─── WINTYPES ───
wintypes: {
  tooltip = {
    fade = false;
    shadow = false;
    opacity = 1.0;
    focus = false;
  };
  popup_menu = {
    fade = true;
    shadow = false;
    opacity = 1.0;
  };
  dropdown_menu = {
    fade = false;
    shadow = false;
    opacity = 1.0;
  };
  menu = {
    fade = true;
    shadow = false;
    opacity = 1.0;
  };
  dock = {
    shadow = false;
  };
  dnd = {
    shadow = false;
  };
};
