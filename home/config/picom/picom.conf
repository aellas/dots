################################
# Backend and core settings
################################
backend = "glx"; # NOTE: confirmed broken for you — maximize/float bug persists even with unredir-if-possible = false below
vsync = true;

use-damage = false;
unredir-if-possible = false;

dithered-present = false;

################################
# Detect settings
################################
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

################################
# Global defaults
################################
corner-radius = 2;

################################
# Rules
################################
rules: (
  # Base: minimal chrome
  {
    blur-background = false;
    corner-radius = 2;
  },

  # Normal windows
  {
    match = "window_type = 'normal'";
    blur-background = false;
  },

  # Tooltips
  {
    match = "window_type = 'tooltip'";
    opacity = 1.0;
    corner-radius = 0;
  },

  # Docks
  {
    match = "window_type = 'dock'";
    corner-radius = 0;
  },

  # Menus / popups
  {
    match = "window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'popup' || window_type = 'popup_menu'";
    opacity = 1.0;
    corner-radius = 0;
  },

  # Fullscreen
  {
    match = "fullscreen";
    corner-radius = 0;
  },

  # Terminals: full opacity, no blur
  {
    match = "class_g = 'Alacritty' || class_g = 'st-256color' || class_g = 'kitty' || class_g = 'FloaTerm' || class_g = 'wezterm' || class_g = 'org.wezfurlong.wezterm'";
    opacity = 1.0;
    blur-background = false;
  },

  # Scratch / updating windows
  {
    match = "class_g = 'bspwm-scratch' || class_g = 'Updating'";
    opacity = 0.93;
    blur-background = false;
  },

  # No-shadow apps
  {
    match = "name = 'Notification' || class_g ?= 'Notify-osd' || class_g = 'Dunst' || "
           "class_g = 'Polybar' || class_g = 'Eww' || class_g = 'jgmenu' || "
           "class_g = 'bspwm-scratch' || class_g = 'Spotify' || class_g = 'retroarch' || "
           "class_g = 'firefox' || class_g = 'librewolf' || class_g = 'Rofi' || class_g = 'Screenkey' || "
           "class_g = 'mpv' || class_g = 'Viewnior'";
    shadow = false;
  },

  # GTK frame extents
  {
    match = "class_g = 'slop' || _GTK_FRAME_EXTENTS@";
    blur-background = false;
  },

  {
    match = "window_type = 'menu' || role = 'popup' || role = 'bubble'";
  },
);

################################
# Animations
################################
animations = (
  # Close / hide
  {
    triggers = ["close", "hide"];

    opacity = {
      curve = "cubic-bezier(0.2, 0, 1, 0.8)";
      duration = 0.20;
      start = "window-raw-opacity-before";
      end = 0;
    };

    blur-opacity = "opacity";
    shadow-opacity = "opacity";
  },

  # Open / show
  {
    triggers = ["open", "show"];

    opacity = {
      curve = "cubic-bezier(0.2, 0, 0, 1)";
      duration = 0.28;
      start = 0;
      end = "window-raw-opacity";
    };

    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";

    scale-x = {
      curve = "cubic-bezier(0.2, 0, 0, 1)";
      duration = 0.28;
      start = 0.94;
      end = 1;
    };

    scale-y = "scale-x";

    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },

  # Resize only
  # Short enough to stay responsive while still smoothing tile changes.
  {
    triggers = ["size"];

    scale-x = {
      curve = "cubic-bezier(0.15, 0, 0, 1)";
      duration = 0.10;
      start = "window-width-before / window-width";
      end = 1;
    };

    scale-y = {
      curve = "cubic-bezier(0.15, 0, 0, 1)";
      duration = 0.10;
      start = "window-height-before / window-height";
      end = 1;
    };

    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
  }
);
