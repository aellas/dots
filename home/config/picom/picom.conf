################################
# Backend and core settings
################################
backend = "glx"; # NOTE: confirmed broken for you — maximize/float bug persists even with unredir-if-possible = false below
vsync = true;

use-damage = false;
unredir-if-possible = false;

dithered-present = false;

################################
# Detect settings
################################
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

################################
# Global defaults
################################
corner-radius = 2;

################################
# Rules
################################
rules: (
  # Base: minimal chrome
  {
    blur-background = false;
    corner-radius = 2;
  },

  # Normal windows
  {
    match = "window_type = 'normal'";
    blur-background = false;
  },

  # Tooltips
  {
    match = "window_type = 'tooltip'";
    opacity = 1.0;
    corner-radius = 0;
  },

  # Docks
  {
    match = "window_type = 'dock'";
    corner-radius = 0;
  },

  # Menus / popups
  {
    match = "window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'popup' || window_type = 'popup_menu'";
    opacity = 1.0;
    corner-radius = 0;
  },

  # Fullscreen
  {
    match = "fullscreen";
    corner-radius = 0;
  },

  # Terminals: full opacity, no blur
  {
    match = "class_g = 'Alacritty' || class_g = 'st-256color' || class_g = 'kitty' || class_g = 'FloaTerm' || class_g = 'wezterm' || class_g = 'org.wezfurlong.wezterm'";
    opacity = 1.0;
    blur-background = false;
  },

  # Scratch / updating windows
  {
    match = "class_g = 'bspwm-scratch' || class_g = 'Updating'";
    opacity = 0.93;
    blur-background = false;
  },

  # No-shadow apps
  {
    match = "name = 'Notification' || class_g ?= 'Notify-osd' || class_g = 'Dunst' || "
           "class_g = 'Polybar' || class_g = 'Eww' || class_g = 'jgmenu' || "
           "class_g = 'bspwm-scratch' || class_g = 'Spotify' || class_g = 'retroarch' || "
           "class_g = 'firefox' || class_g = 'librewolf' || class_g = 'Rofi' || class_g = 'Screenkey' || "
           "class_g = 'mpv' || class_g = 'Viewnior'";
    shadow = false;
  },

  # GTK frame extents
  {
    match = "class_g = 'slop' || _GTK_FRAME_EXTENTS@";
    blur-background = false;
  },

  {
    match = "window_type = 'menu' || role = 'popup' || role = 'bubble'";
  },
);

################################
# Animations
################################
animations = (
  # Close / hide
  {
    triggers = ["close", "hide"];
    opacity = {
      curve = "cubic-bezier(0.2, 0, 1, 0.8)";
      duration = 0.15;
      start = "window-raw-opacity-before";
      end = 0;
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
  },

  # Open / show
  {
    triggers = ["open", "show"];
    opacity = {
      curve = "cubic-bezier(0.2, 0, 0, 1)";
      duration = 0.25;
      start = 0;
      end = "window-raw-opacity";
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    scale-x = {
      curve = "cubic-bezier(0.2, 0, 0, 1)";
      duration = 0.25;
      start = 0.92;
      end = 1;
    };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },

  # Resize / move
  {
    triggers = ["geometry"];
    scale-x = {
      curve = "cubic-bezier(0.2, 0, 0, 1)";
      duration = 0.2;
      start = "window-width-before / window-width";
      end = 1;
    };
    scale-y = {
      curve = "cubic-bezier(0.2, 0, 0, 1)";
      duration = 0.2;
      start = "window-height-before / window-height";
      end = 1;
    };
    offset-x = {
      curve = "cubic-bezier(0.2, 0, 0, 1)";
      duration = 0.2;
      start = "window-x-before - window-x";
      end = 0;
    };
    offset-y = {
      curve = "cubic-bezier(0.2, 0, 0, 1)";
      duration = 0.2;
      start = "window-y-before - window-y";
      end = 0;
    };
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  }
);

################################
# NOTES — read before reporting bugs
################################
# 1. Changed vs your original:
#    - backend: glx -> xrender (fixes wezterm/librewolf maximize repaint bug, confirmed)
#    - use-damage: true -> false
#    - fading: true -> false (animations block replaces it entirely)
#    - open/show scale start: 0.6 -> 0.92 (subtler = reads smoother)
#    - matched easing curves between opacity/scale so they resolve together
#    - close/hide duration shortened slightly (0.1 -> 0.15 but linear->eased)
#
# 2. If you ever want to try re-enabling GLX (e.g. for blur down the line),
#    the maximize bug will likely come back — it's tied to the backend,
#    not any single flag. Known picom issue territory with GLX + apps that
#    do their own GPU compositing (wezterm/wgpu, librewolf/WebRender).
#
# 3. If animations feel any less smooth on xrender than they did on GLX,
#    that's a real tradeoff (xrender is generally the "safer but slower"
#    backend) — but given this is a redraw-correctness bug, not a
#    performance one, it's the right tradeoff to make first.
