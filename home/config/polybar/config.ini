include-file = ~/.config/polybar/colors.ini

; ===== MAIN BAR SETTINGS =====
[bar/main]
width = 100%
height = 54
radius = 0
line-size = 2
line-color = ${colors.line}
override-redirect = false
background = ${colors.bg}
foreground = ${colors.fg}
enable-ipc = true
font-0 = "JetBrainsMono Nerd Font:size=14:weight=SemiBold;3"
font-1 = "DejaVu Sans Mono wifi ramp:size=16;1"
font-2 = "Noto Sans:size=12;1"
font-3 = "JetBrainsMonoNF:size=12;3"
font-4 = "JetBrainsMonoNF:size=17;4"

modules-left   = workspaces  xwindow
modules-center = clock
modules-right  = tray battery backlight alsa network  bluetooth

separator = "   "
padding-left = 1
padding-right = 3
module-margin = 1.0
wm-restack = bspwm

; ===== CUSTOM MODULES =====


[module/workspaces]
type = internal/bspwm
format = <label-state>
index-sort = true
pin-workspaces = true
label-focused = %index%
label-focused-foreground = ${colors.focused-fg}
label-focused-underline = ${colors.focused-line}
label-focused-padding = 1
label-occupied = %index%
label-occupied-foreground = ${colors.occupied-fg}
label-occupied-padding = 1
label-empty = %index%
label-empty-foreground = ${colors.empty-fg}
label-empty-padding = 1
label-urgent = %index%
label-urgent-foreground = ${colors.urgent-fg}
label-urgent-underline = ${colors.urgent-line}
label-urgent-padding = 1

;==== SYSTEM MODULES =====
[module/xwindow]
type = internal/xwindow
label = %title:0:30...%
label-foreground = ${colors.fg}

[module/clock]
type = internal/date
interval = 1
date = %a %d
time = %H:%M
label = %date%  %time%
label-foreground = ${colors.fg}


[module/tray]
type = internal/tray
tray-spacing = 15px
tray-size = 44%
tray-padding = 2px
tray-foreground = ${colors.tray}


[module/alsa]
type = internal/alsa
use-ui-max = true
interval = 5
format-volume = <label-volume>
label-volume =   %percentage%%
label-volume-foreground = ${colors.fg}
label-muted = 󰝟 muted
label-muted-foreground = ${colors.fg}
click-right = wezterm -e wiremix
label-font = 5


[module/network]
type = internal/network
interface = wlp0s20f3
interval = 1.0
accumulate-stats = true
unknown-as-up = true
label-connected = 
label-disconnected = 
format-connected = <ramp-signal> <label-connected>
format-disconnected = <label-disconnected>
ramp-signal-0 = 
ramp-signal-1 = 
ramp-signal-2 = 
ramp-signal-3 = 
ramp-signal-4 = 
ramp-signal-5 = 

[module/battery]
type = internal/battery
full-at = 99
battery = BAT0
adapter = ADP1
poll-interval = 1
time-format = %H:%M
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> 100%
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = " Full"
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂
ramp-capacity-10 = 󰁹
animation-charging-0 = 󰢟
animation-charging-1 = 󰢜
animation-charging-2 = 󰂆
animation-charging-3 = 󰂇
animation-charging-4 = 󰂈
animation-charging-5 = 󰢝
animation-charging-6 = 󰂉
animation-charging-7 = 󰢞
animation-charging-8 = 󰂊
animation-charging-9 = 󰂋
animation-charging-10 = 󰂅
animation-charging-framerate = 750

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/bluetooth.sh
interval = 5
click-left = wezterm -e bluetui
label = %output%
label-font = 5


[module/backlight]
type = internal/backlight
label = 󰃠  %percentage%%
card = intel_backlight
use-actual-brightness = true
poll-interval = 0
enable-scroll = true
scroll-interval = 2
